<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://yoyaku-daicho-api.innofool.workers.dev http://127.0.0.1:8787; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OMOTENASI">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>OMOTENASI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 合言葉の画面 -->
<section id="gate" class="gate" hidden>
  <div class="gate-card">
    <h1>OMOTENASI</h1>
    <p class="gate-note" id="gate-note">お客様の情報はこの端末（iPad）の中に、暗号化して保存されます。インターネットには送りません。</p>
    <div id="gate-acct" class="gate-acct" hidden></div>
    <form id="gate-form" autocomplete="off">
      <label>合言葉<input type="password" id="gate-pass" autocomplete="current-password" required></label>
      <label id="gate-pass2-wrap" hidden>もう一度（確認）<input type="password" id="gate-pass2" autocomplete="new-password"></label>
      <p id="gate-hint" class="hint"></p>
      <p id="gate-err" class="err" role="alert"></p>
      <button type="submit" id="gate-btn" class="primary">開く</button>
    </form>
    <p class="gate-dir" id="gate-dir">合言葉を忘れると、だれにも開けられません（作った人にも）。紙に控えて安全な場所に保管してください。</p>
  </div>
</section>

<!-- 本体 -->
<div id="app" class="app" hidden>
  <header class="topbar">
    <button id="btn-side" class="icon-btn" aria-label="メニューを開く・閉じる">☰</button>
    <span class="brand"><span class="logo-dot"></span><span id="store-name">OMOTENASI</span> ▾</span>
    <span id="sync-state" class="sync-state" hidden></span>
  </header>
  <div class="layout">
    <nav id="side" class="side" aria-label="メニュー">
      <button data-go="home"><i>⌂</i>ホーム</button>
      <button data-go="received"><i>✉</i>受付履歴</button>
      <button data-go="ledger"><i>▦</i>予約台帳</button>
      <button data-go="search"><i>⌕</i>予約を検索</button>
      <button data-go="customers"><i>☺</i>顧客台帳</button>
      <button data-go="analytics"><i>▥</i>分析</button>
      <button class="grp" data-grp="tools"><i>⎙</i>ツール<span class="car">⌄</span></button>
      <div class="sub" id="grp-tools">
        <button data-go="print">印刷マネージャー</button>
        <button data-go="csv">CSVダウンロード</button>
        <button data-go="widget">ウェブ予約ウィジェット</button>
      </div>
      <button class="grp" data-grp="settings"><i>⚙</i>設定<span class="car">⌄</span></button>
      <div class="sub" id="grp-settings">
        <button data-go="settings">お店・テーブル・コース</button>
        <button data-go="security">合言葉・バックアップ</button>
        <button id="btn-lock">ロック（ログアウト）</button>
      </div>
    </nav>
    <main id="main">
      <!-- ホーム -->
      <section id="v-home" class="view">
        <h2 class="vt">ホーム</h2>
        <div class="tb">
          <div class="nav3"><button id="h-today">本日</button><button id="h-prev" aria-label="前の月">‹</button><button id="h-next" aria-label="次の月">›</button></div>
          <span class="tb-title" id="h-title"></span><span class="sep"></span>
          <div class="seg" id="h-mode"><button data-mode="memo">メモ</button><button data-mode="count" class="on">予約数</button></div>
        </div>
        <div class="mcal" id="h-cal"></div>
        <div class="box gray" id="h-info"></div>
      </section>

      <!-- 受付履歴 -->
      <section id="v-received" class="view" hidden>
        <h2 class="vt">受付履歴</h2>
        <div class="tabs" id="rc-tabs">
          <button data-tab="all" class="on">すべて</button><button data-tab="new">新規</button><button data-tab="change">変更</button><button data-tab="cancel">取消</button><button data-tab="problem">問題のある予約</button>
        </div>
        <div class="table-wrap"><table class="tbl rtbl" id="rc-table"></table></div>
        <button id="rc-more" class="wide ghost-line">過去分を取得</button>
      </section>

      <!-- 予約台帳 -->
      <section id="v-ledger" class="view" hidden>
        <div class="tb">
          <div class="nav3"><button id="d-today">本日</button><button id="d-prev" aria-label="前の日">‹</button><button id="d-next" aria-label="次の日">›</button></div>
          <label class="date-pick"><span class="cal-ic">📅</span><span id="d-label" class="tb-title"></span><input type="date" id="d-input" aria-label="日付を選ぶ"></label>
          <span class="sep"></span>
          <div class="seg" id="l-mode">
            <button data-mode="list">予約リスト</button><button data-mode="time" class="on">タイムテーブル</button><button id="btn-new">新規予約</button><button id="btn-more" aria-label="その他">…</button>
          </div>
        </div>
        <div class="morebox" id="morebox" hidden>
          <label class="chk"><input type="checkbox" id="show-cancel"> キャンセルも表示</label>
          <button id="btn-floor">テーブル配置図を見る</button>
          <button id="btn-print-day">この日を印刷</button>
        </div>
        <div class="box info" id="day-info"></div>
        <div id="l-time" class="grid-wrap"><div class="grid" id="grid"></div></div>
        <div id="l-list" hidden><div class="table-wrap"><table class="tbl" id="day-table"></table></div></div>
        <div id="l-floor" hidden><div class="tb"><label>時刻 <select id="floor-time"></select></label><span class="muted" id="floor-note"></span><span class="sep"></span><button id="floor-close">タイムテーブルに戻る</button></div><div id="floor" class="floor"></div></div>
      </section>

      <!-- 予約を検索 -->
      <section id="v-search" class="view" hidden>
        <h2 class="vt">予約を検索</h2>
        <div class="searchbar"><input type="search" id="s-q" placeholder="検索ワード（#番号 で検索すると予約番号から検索できます）"><button id="s-go" aria-label="検索">⌕</button></div>
        <div class="table-wrap" id="s-wrap" hidden><table class="tbl" id="s-table"></table></div>
      </section>

      <!-- 顧客台帳 -->
      <section id="v-customers" class="view" hidden>
        <h2 class="vt" id="c-vt">顧客台帳</h2>
        <div class="tabs" id="c-tabs"><button data-tab="list" class="on">顧客一覧</button><button data-tab="hidden">非表示の顧客一覧</button><button data-tab="new">新規顧客</button></div>
        <div id="c-listbox">
          <div class="tb">
            <div class="searchbar grow"><input type="search" id="c-q" placeholder="お名前・ふりがな・電話番号・会社名"><button id="c-go" aria-label="検索">⌕</button></div>
            <div class="seg dark" id="c-sort"><button data-sort="kana">▾お名前</button><button data-sort="visits">▾来店回数</button></div>
          </div>
          <div class="table-wrap"><table class="tbl" id="c-table"></table></div>
        </div>
        <div id="c-form" hidden></div>
      </section>

      <!-- 分析 -->
      <section id="v-analytics" class="view" hidden>
        <div class="tabs scroll" id="a-tabs">
          <button data-tab="top" class="on">トップ</button><button data-tab="counts">予約数</button><button data-tab="sources">予約経路</button><button data-tab="cancels">キャンセル</button><button data-tab="visits">来店回数</button><button data-tab="staff">担当者</button><button data-tab="course">コース</button><button data-tab="free">自由設定欄</button><button data-tab="tags">予約タグ</button><button data-tab="params">カスタムパラメーター</button>
        </div>
        <div id="a-body"></div>
      </section>

      <!-- 印刷マネージャー -->
      <section id="v-print" class="view" hidden>
        <h2 class="vt">印刷マネージャー</h2>
        <div class="tabs" id="p-tabs"><button data-tab="list" class="on">☰ 予約リスト</button><button data-tab="time">▦ タイムテーブル</button></div>
        <div class="pm" id="p-form"></div>
      </section>

      <!-- CSVダウンロード -->
      <section id="v-csv" class="view" hidden><h2 class="vt">CSVダウンロード</h2><div id="csv-body"></div></section>
      <!-- ウェブ予約ウィジェット -->
      <section id="v-widget" class="view" hidden><h2 class="vt">ツール › ウェブ予約ウィジェット</h2><div id="widget-body"></div></section>
      <!-- 設定 -->
      <section id="v-settings" class="view" hidden><h2 class="vt">設定</h2><div id="set-body" class="settings"></div></section>
      <section id="v-security" class="view" hidden><h2 class="vt">合言葉・バックアップ</h2><div id="sec-body" class="settings"></div></section>
    </main>
    <!-- 右側の入力欄（新規予約・予約の詳細・変更） -->
    <aside id="panel" class="panel" hidden aria-label="予約">
      <div class="pn-head"><span id="pn-title"></span><button id="pn-close" class="icon-btn" aria-label="閉じる">✕</button></div>
      <div class="pn-body" id="pn-body"></div>
      <div class="pn-foot" id="pn-foot"></div>
    </aside>
  </div>
</div>

<!-- ドラッグで動かした時の確認 -->
<div id="movebar" class="movebar" hidden>
  <div class="mv-text" id="mv-text"></div>
  <div class="mv-acts"><button id="mv-cancel">キャンセル</button><button id="mv-ok" class="primary">OK</button></div>
</div>

<!-- 確認の小窓 -->
<dialog id="dlg-ask" class="ask">
  <div class="ask-head"><b id="ask-title"></b><button id="ask-x" class="icon-btn" aria-label="閉じる">×</button></div>
  <div class="ask-body" id="ask-body"></div>
  <div class="ask-foot"><button id="ask-no">キャンセル</button><button id="ask-yes" class="primary-line">OK</button></div>
</dialog>

<!-- 印刷用（画面には出ない） -->
<div id="print-area" class="print-area"></div>

<div id="toast" class="toast" role="status"><span id="toast-text"></span><button id="toast-act" hidden></button></div>
<script src="config.js"></script>
<script src="core.js"></script>
<script src="vault.js"></script>
<script src="account.js"></script>
<script src="app.js"></script>
</body>
</html>
